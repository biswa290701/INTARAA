<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INTARAA WebGL Demo</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
  margin: 0;
  background: #000;
  height: 100vh;
  overflow: hidden;
}

#unity-container {
  position: relative;
  width: 100%;
  height: 100%;
}

#unity-canvas {
  width: 100%;
  height: 100%;
  background: #000;
}

.back-btn {
  position: absolute;
  top: 1.5rem;
  left: 1.5rem;
  background-color: #5498ba;
  color: #fff;
  padding: 0.6rem 1rem;
  border-radius: 0.5rem;
  text-decoration: none;
  font-weight: bold;
  z-index: 10;
  transition: all 0.3s ease;
}

.back-btn:hover {
  background-color: #fff;
  color: #1a3340;
}

/* Centered Unity loading layout */
#unity-loading-bar {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 60%;
  max-width: 400px;
  text-align: center;
  font-family: 'Arial', sans-serif;
  color: #fff;
  transition: opacity 0.5s ease;
}

/* Optional logo */
#unity-logo {
  width: 150px;
  height: 130px;
  background: url("TemplateData/unity-logo-dark.png") no-repeat center;
  background-size: contain;
  margin: 0 auto 20px;
}

/* Clean, theme-colored progress bar */
#unity-progress-bar-empty {
  width: 100%;
  height: 16px;
  background-color: rgba(255, 255, 255, 0.2);
  border: 2px solid #5498ba;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 0 8px rgba(84, 152, 186, 0.5);
}

#unity-progress-bar-full {
  width: 0%;
  height: 100%;
  background-color: #5498ba;
  border-radius: 6px;
  transition: width 0.4s ease;
}

/* Loading text below the bar */
#unity-loading-text {
  margin-top: 12px;
  font-size: 1rem;
  color: #fff;
  letter-spacing: 0.5px;
  opacity: 0.9;
}

  </style>
  </head>

  <body>
    <a href="products.html" class="back-btn">← Back</a>

    <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div id="unity-loading-text">Loading...</div>
    </div>
  </div>

  <script>
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/Newhope2025.loader";
    const config = {
      dataUrl: buildUrl + "/Newhope2025.data",
      frameworkUrl: buildUrl + "/Newhope2025.framework.js",
      codeUrl: buildUrl + "/Newhope2025.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "YourCompany",
      productName: "INTARAA Demo",
      productVersion: "1.0",
    };

    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const loadingText = document.querySelector("#unity-loading-text");

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (progress * 100) + "%";
        loadingText.textContent = `Loading... ${Math.round(progress * 100)}%`;
      }).then((unityInstance) => {
        loadingBar.style.opacity = 0;
        setTimeout(() => loadingBar.style.display = "none", 500);
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);

  </script>
</body>
</html>
