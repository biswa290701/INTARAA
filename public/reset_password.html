<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – SympathAI</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .reset-page-bg {
            min-height: 100vh;
            background-image: url('image/img.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .reset-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 2.5rem;
            max-width: 450px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            backdrop-filter: blur(5px);
        }

        .reset-box h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #1a3340;
            font-size: 2rem;
        }

        .reset-box label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: bold;
            color: #1a3340;
        }

        .reset-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1.2rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        .reset-box button {
            width: 100%;
            padding: 12px;
            background: #5498ba;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s ease;
            font-weight: bold;
        }

        .reset-box button:hover {
            background: #1a3340;
        }

        .back-link {
            text-align: center;
            margin-top: 1rem;
        }

        .back-link a {
            color: #5498ba;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header class="navbar">
        <h1 class="logo">SympathAI</h1>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="signin.html">Sign In</a></li>
        </ul>
    </header>

    <div class="reset-page-bg">
        <div class="reset-box">
            <h2>Reset Password</h2>

            <!-- Token will be added dynamically by backend route -->
            <form action="/reset-password" method="POST">

                <input type="hidden" id="token" name="token" value="">

                <label for="password">New Password</label>
                <input type="password" id="password" name="password" placeholder="Enter new password" required>

                <label for="confirm">Confirm New Password</label>
                <input type="password" id="confirm" name="confirm" placeholder="Re-enter new password" required>

                <button type="submit">Reset Password</button>
            </form>

            <div class="back-link">
                <p><a href="signin.html">Back to Sign In</a></p>
            </div>
        </div>
    </div>

    <script>
        // Extract token from URL and insert into hidden field
        const token = window.location.pathname.split("/").pop();
        document.getElementById("token").value = token;
    </script>

</body>
</html>
