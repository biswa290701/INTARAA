<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You – INTARAA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f2f8fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 1rem;
        }

        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 2.4rem;
            color: #1a3340;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.1rem;
            color: #444;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #5498ba;
            color: white;
            font-size: 1rem;
            border-radius: 6px;
            text-decoration: none;
            transition: 0.3s ease;
            font-weight: bold;
        }

        .btn:hover {
            background: #1a3340;
            color: #fff;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Thank You!</h1>
        <p>Your submission has been received successfully.<br>
        Our team will get back to you shortly.</p>

        <a class="btn" href="index.html">Back to Home</a>
    </div>

</body>
</html>
