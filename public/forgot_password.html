<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password – INTARAA</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .forgot-page-bg {
            min-height: 100vh;
            background-image: url('image/img.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .forgot-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 2.5rem;
            max-width: 450px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            backdrop-filter: blur(5px);
        }

        .forgot-box h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #1a3340;
            font-size: 2rem;
        }

        .forgot-box label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.4rem;
        }

        .forgot-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1.2rem;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .forgot-box button {
            width: 100%;
            padding: 12px;
            background: #5498ba;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .forgot-box button:hover {
            background: #1a3340;
        }

        .back-link {
            text-align: center;
            margin-top: 1rem;
        }

        .back-link a {
            color: #5498ba;
            font-weight: bold;
            text-decoration: none;
        }

        .dialog {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .dialog-box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
        }

        .dialog-box h3 {
            margin-bottom: 1rem;
            font-size: 1.5rem;
            color: #1a3340;
        }

        .dialog-box button {
            margin-top: 1rem;
            padding: 10px 20px;
            background: #5498ba;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }
        .dialog-box button:hover {
            background: #1a3340;
        }

    </style>
</head>

<body>

    <header class="navbar">
        <h1 class="logo">INTARAA</h1>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="signin.html">Sign In</a></li>
        </ul>
    </header>

    <div class="forgot-page-bg">
        <div class="forgot-box">
            <h2>Forgot Password</h2>

            <form id="forgotForm">
                <label for="email">Enter your registered email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>

                <button type="submit">Send Reset Link</button>
            </form>

            <div class="back-link">
                <p><a href="signin.html">Back to Sign In</a></p>
            </div>
        </div>
    </div>

    <!-- UNIVERSAL SUCCESS DIALOG -->
    <div id="successDialog" class="dialog" style="display:none;">
    <div class="dialog-box">
        <h3>Success</h3>
        <p id="successMessage"></p>
        <button onclick="closeSuccessDialog()">OK</button>
    </div>
    </div>

    <script>
    document.getElementById("forgotForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const btn = e.target.querySelector("button");
        btn.disabled = true;
        btn.textContent = "Processing...";

        const email = document.getElementById("email").value;

        const response = await fetch("/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });

        const result = await response.json();

        if (result.error) {
            showSuccessDialog(result.error);
        } else {
            showSuccessDialog(
                "A password reset link has been sent to your email.",
                "signin.html"
            );
        }
    });

    function showSuccessDialog(message, redirect = null) {
        document.getElementById("successMessage").textContent = message;
        document.getElementById("successDialog").style.display = "flex";

        window._afterDialogRedirect = redirect;
    }

    function closeSuccessDialog() {
        document.getElementById("successDialog").style.display = "none";

        const btn = document.querySelector("#forgotForm button");
        if (btn) {
            btn.disabled = false;
            btn.textContent = "Send Reset Link";
        }

        if (window._afterDialogRedirect) {
            window.location.href = window._afterDialogRedirect;
        }
    }
    </script>


</body>
</html>
