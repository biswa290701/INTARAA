<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – INTARAA</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .reset-page-bg {
            min-height: 100vh;
            background-image: url('image/img.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .reset-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 2.5rem;
            max-width: 450px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            backdrop-filter: blur(5px);
        }

        .reset-box h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #1a3340;
            font-size: 2rem;
        }

        .reset-box label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: bold;
            color: #1a3340;
        }

        .reset-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1.2rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        .reset-box button {
            width: 100%;
            padding: 12px;
            background: #5498ba;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s ease;
            font-weight: bold;
        }

        .reset-box button:hover {
            background: #1a3340;
        }

        .back-link {
            text-align: center;
            margin-top: 1rem;
        }

        .back-link a {
            color: #5498ba;
            text-decoration: none;
            font-weight: bold;
        }

        .dialog {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .dialog-box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
        }

        .dialog-box h3 {
            margin-bottom: 1rem;
            font-size: 1.5rem;
            color: #1a3340;
        }

        .dialog-box button {
            margin-top: 1rem;
            padding: 10px 20px;
            background: #5498ba;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }
        .dialog-box button:hover {
            background: #1a3340;
        }

    </style>
</head>

<body>

    <header class="navbar">
        <h1 class="logo">INTARAA</h1>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="signin.html">Sign In</a></li>
        </ul>
    </header>

    <div class="reset-page-bg">
        <div class="reset-box">
            <h2>Reset Password</h2>

            <form id="resetForm">

                <input type="hidden" id="token" name="token" value="">

                <label for="password">New Password</label>
                <input type="password" id="password" name="password" placeholder="Enter new password" required>

                <label for="confirm">Confirm New Password</label>
                <input type="password" id="confirm" name="confirm" placeholder="Re-enter new password" required>

                <button type="submit">Reset Password</button>
            </form>

            <div class="back-link">
                <p><a href="signin.html">Back to Sign In</a></p>
            </div>
        </div>
    </div>

    <!-- UNIVERSAL SUCCESS DIALOG -->
    <div id="successDialog" class="dialog" style="display:none;">
    <div class="dialog-box">
        <h3>Success</h3>
        <p id="successMessage"></p>
        <button onclick="closeSuccessDialog()">OK</button>
    </div>
    </div>


<script>
// Extract token from URL
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get("token");
document.getElementById("token").value = token;

// Handle Reset Password submit
document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const token = document.getElementById("token").value;
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;

    const response = await fetch("/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, password, confirm })
    });

    const result = await response.json();

    if (result.error) {
        showSuccessDialog(result.error);
    } else {
        showSuccessDialog("Your password has been reset successfully!", "signin.html");
    }

});

    function showSuccessDialog(message, redirect = null) {
        document.getElementById("successMessage").textContent = message;
        document.getElementById("successDialog").style.display = "flex";

        window._afterDialogRedirect = redirect; // store redirect for after clicking OK
    }

    function closeSuccessDialog() {
        document.getElementById("successDialog").style.display = "none";

        if (window._afterDialogRedirect) {
            window.location.href = window._afterDialogRedirect;
        }
    }

</script>

</body>
</html>
